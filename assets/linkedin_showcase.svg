        <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#0284c7">0.8425</text>

        <line x1="160" y1="12" x2="160" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="180" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">CHURN RECALL RATE</text>
        <text x="180" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#0f172a">76.74%</text>

        <line x1="330" y1="12" x2="330" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="350" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">5-FOLD CV MEAN</text>
        <text x="350" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#475569">0.8468</text>
