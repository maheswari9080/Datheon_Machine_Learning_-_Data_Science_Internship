      <g transform="translate(24, 192)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#334155">
        <circle cx="6" cy="6" r="3" fill="#0d9488"/>
        <text x="18" y="10">Encapsulated StandardScaler inside Pipeline prevents test leakage.</text>
        <circle cx="6" cy="28" r="3" fill="#0d9488"/>
        <text x="18" y="32">Includes 2D decision boundary projection on discriminatory petal features.</text>
      </g>
