      <text x="24" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Multi-Class Benchmark Pipeline (Iris)</text>
      <text x="24" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748b">Logistic Regression vs. Decision Tree under Stratified 80:20 Holdout</text>

      <!-- Metrics Callout Box -->
