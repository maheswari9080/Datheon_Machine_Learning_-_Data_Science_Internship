        <rect width="56" height="20" rx="4" fill="#0f172a"/>
        <text x="11" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">TASK 2</text>
        <rect x="64" y="0" width="130" height="20" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="74" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#d97706">REGRESSION</text>
