        <text x="11" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">TASK 4</text>
        <rect x="64" y="0" width="130" height="20" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
        <text x="74" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#8b5cf6">NLP SENTIMENT</text>
