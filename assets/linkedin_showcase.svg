      <text x="14" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">18/18 Tests Passed</text>
      <circle cx="140" cy="16" r="4" fill="#10b981"/>

      <rect x="175" y="0" width="175" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#soft-shadow)"/>
      <text x="189" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">30 Atomic Commits</text>
      <circle cx="330" cy="16" r="4" fill="#0284c7"/>
    </g>
  </g>

  <!-- 4 Project Grid Showcase -->
