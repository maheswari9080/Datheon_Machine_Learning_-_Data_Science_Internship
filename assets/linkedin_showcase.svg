      <text x="24" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#64748b">TF-IDF Vectorization • MultinomialNB vs. Logistic Regression</text>

      <!-- Metrics Callout Box -->
      <g transform="translate(24, 108)">
        <rect width="477" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        
        <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">LOGREG ACCURACY</text>
        <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#8b5cf6">85.83%</text>

        <line x1="160" y1="12" x2="160" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="180" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">ROC-AUC DISCRIMINATION</text>
        <text x="180" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#0f172a">0.9346</text>

        <line x1="350" y1="12" x2="350" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="370" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">NAIVE BAYES ACC</text>
        <text x="370" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#475569">84.83%</text>
      </g>

      <!-- Bullet Points -->
      <g transform="translate(24, 192)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#334155">
        <circle cx="6" cy="6" r="3" fill="#8b5cf6"/>
        <text x="18" y="10">Sublinear TF-IDF (5,000 bigrams) captures critical negation modifiers.</text>
        <circle cx="6" cy="28" r="3" fill="#8b5cf6"/>
        <text x="18" y="32">Live sentiment inference function with confidence ratings and error auditing.</text>
