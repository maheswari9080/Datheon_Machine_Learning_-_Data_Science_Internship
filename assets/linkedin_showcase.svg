    <!-- QUADRANT 1: Multi-Class Benchmark Classification -->
    <g transform="translate(0, 0)" filter="url(#soft-shadow)">
      <rect width="525" height="255" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="255" rx="2" fill="#0d9488"/>

      <!-- Header -->
      <g transform="translate(24, 22)">
        <rect width="56" height="20" rx="4" fill="#0f172a"/>
        <text x="11" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">TASK 1</text>
        <rect x="64" y="0" width="130" height="20" rx="4" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
        <text x="74" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#0d9488">CLASSIFICATION</text>
