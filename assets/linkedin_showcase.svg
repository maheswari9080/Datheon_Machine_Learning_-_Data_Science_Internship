<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="header-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" rx="16" fill="url(#canvas-bg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1184 0 C 1192.84 0 1200 7.16 1200 16 L 1200 8 L 0 8 Z" fill="url(#header-accent)"/>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <!-- Category Pill -->
    <rect width="365" height="26" rx="13" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="4.5" fill="#0d9488"/>
    <text x="25" y="17" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0d9488" letter-spacing="0.8">DATHEON MACHINE LEARNING INTERNSHIP</text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.8">
      Applied Machine Learning Studio
    </text>
    <text x="0" y="92" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#475569">
      Four Production Data Science Pipelines • Reproducible Supervised Learning &amp; NLP
    </text>

