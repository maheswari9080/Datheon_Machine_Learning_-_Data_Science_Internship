        <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#d97706">0.6353</text>

        <line x1="160" y1="12" x2="160" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="180" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">TEST ROOT MEAN SQ ERROR</text>
        <text x="180" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#0f172a">$69,127</text>

        <line x1="340" y1="12" x2="340" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="360" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">MEAN ABS ERROR</text>
        <text x="360" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#475569">$49,645</text>
