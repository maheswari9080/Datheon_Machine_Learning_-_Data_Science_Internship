    <!-- QUADRANT 2: Real Estate Housing Price Prediction -->
    <g transform="translate(555, 0)" filter="url(#soft-shadow)">
      <rect width="525" height="255" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="255" rx="2" fill="#d97706"/>

      <!-- Header -->
