        <rect width="477" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        
        <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">DECISION TREE ACCURACY</text>
        <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#0d9488">96.67%</text>

        <line x1="180" y1="12" x2="180" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="200" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">MACRO F1 SCORE</text>
        <text x="200" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#0f172a">0.9666</text>

        <line x1="330" y1="12" x2="330" y2="52" stroke="#e2e8f0" stroke-width="1"/>

        <text x="350" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">LOGREG ACCURACY</text>
        <text x="350" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#475569">93.33%</text>
